services:
  - type: web
    name: hemolink-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: hemolink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false          # Set this manually after Vercel deploy
      - key: AT_API_KEY
        sync: false          # Africa's Talking API key
      - key: AT_USERNAME
        sync: false          # Africa's Talking username (use "sandbox" for testing)

databases:
  - name: hemolink-db
    databaseName: hemolink
    user: hemolink
    plan: free
